<svg xmlns="http://www.w3.org/2000/svg" width="480" height="230" viewBox="0 0 480 230" role="img" aria-label="// operator stats">
<defs>
  <linearGradient id="neon" x1="0" x2="1"><stop offset="0" stop-color="#00F0FF"/><stop offset=".55" stop-color="#B026FF"/><stop offset="1" stop-color="#FF007F"/></linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF007F" stop-opacity=".35"/><stop offset="1" stop-color="#FF007F" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#00F0FF" stroke-opacity=".05"/></pattern>
</defs>
<style>
  text{font-family:'JetBrains Mono','Fira Code',Consolas,'Liberation Mono','Courier New',monospace}
  .in{opacity:0;animation:in .5s ease-out forwards}
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2s cubic-bezier(.3,.7,.2,1) .2s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1}.draw{animation:none;stroke-dashoffset:0}}
</style>
<rect x="1" y="1" width="478" height="228" rx="10" fill="#05050A"/>
<rect x="1" y="1" width="478" height="228" rx="10" fill="url(#grid)"/>
<rect x="1" y="1" width="478" height="228" rx="10" fill="none" stroke="#00F0FF" stroke-opacity=".75" stroke-width="1.5"/>
<text x="22" y="34" font-size="14" fill="#00F0FF">// operator stats</text>
<text x="458" y="34" font-size="12" fill="#6B6B8A" text-anchor="end">@youssefabidi13</text>
<line x1="22" y1="46" x2="458" y2="46" stroke="#00F0FF" stroke-opacity=".2"/>
<g class="in" style="animation-delay:0.1s">
  <rect x="24" y="69" width="8" height="8" fill="#00FF66" filter="url(#glow)"/>
  <text x="42" y="78" font-size="13" fill="#6B6B8A">public repos</text>
  <text x="288" y="78" font-size="14" font-weight="700" fill="#D6FBFF" text-anchor="end">62</text>
</g>
<g class="in" style="animation-delay:0.18s">
  <rect x="24" y="93" width="8" height="8" fill="#00F0FF" filter="url(#glow)"/>
  <text x="42" y="102" font-size="13" fill="#6B6B8A">original repos <tspan fill="#3E3E58">(no forks)</tspan></text>
  <text x="288" y="102" font-size="14" font-weight="700" fill="#D6FBFF" text-anchor="end">55</text>
</g>
<g class="in" style="animation-delay:0.26s">
  <rect x="24" y="117" width="8" height="8" fill="#B026FF" filter="url(#glow)"/>
  <text x="42" y="126" font-size="13" fill="#6B6B8A">active days <tspan fill="#3E3E58">(12 mo)</tspan></text>
  <text x="288" y="126" font-size="14" font-weight="700" fill="#D6FBFF" text-anchor="end">2</text>
</g>
<g class="in" style="animation-delay:0.33999999999999997s">
  <rect x="24" y="141" width="8" height="8" fill="#FF007F" filter="url(#glow)"/>
  <text x="42" y="150" font-size="13" fill="#6B6B8A">stars earned</text>
  <text x="288" y="150" font-size="14" font-weight="700" fill="#D6FBFF" text-anchor="end">35</text>
</g>
<g class="in" style="animation-delay:0.42000000000000004s">
  <rect x="24" y="165" width="8" height="8" fill="#00F0FF" filter="url(#glow)"/>
  <text x="42" y="174" font-size="13" fill="#6B6B8A">contributions <tspan fill="#3E3E58">(12 mo)</tspan></text>
  <text x="288" y="174" font-size="14" font-weight="700" fill="#D6FBFF" text-anchor="end">5</text>
</g>
<g class="in" style="animation-delay:0.5s">
  <rect x="24" y="189" width="8" height="8" fill="#00FF66" filter="url(#glow)"/>
  <text x="42" y="198" font-size="13" fill="#6B6B8A">followers</text>
  <text x="288" y="198" font-size="14" font-weight="700" fill="#D6FBFF" text-anchor="end">154</text>
</g><g class="in" style="animation-delay:.3s">
  <circle cx="392" cy="136" r="56" fill="none" stroke="#1A1A2E" stroke-width="6"/>
  <circle cx="392" cy="136" r="56" fill="none" stroke="url(#neon)" stroke-width="6" stroke-linecap="round" pathLength="1" class="draw" transform="rotate(-90 392 136)" filter="url(#glow)"/>
  <circle cx="392" cy="136" r="44" fill="none" stroke="#B026FF" stroke-opacity=".35" stroke-dasharray="2 5"/>
  <text x="392" y="142" font-size="26" font-weight="800" fill="#00F0FF" text-anchor="middle" filter="url(#glow)">5</text>
  <text x="392" y="160" font-size="10" fill="#6B6B8A" text-anchor="middle">contributions</text>
</g>
</svg>