<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Youssef ABIDI — Shopify platform engineer and full-stack software engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05050A"/>
      <stop offset=".65" stop-color="#07061A"/>
      <stop offset="1" stop-color="#14041C"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset=".55" stop-color="#B026FF"/>
      <stop offset="1" stop-color="#FF007F"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00F0FF" stop-opacity=".10"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00FF66" stop-opacity="0"/>
      <stop offset=".85" stop-color="#00FF66" stop-opacity=".55"/>
      <stop offset="1" stop-color="#CCFFE0" stop-opacity=".95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00F0FF" stroke-opacity=".07"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#000" fill-opacity=".35"/>
    </pattern>
    <clipPath id="frame"><rect x="8" y="8" width="984" height="324" rx="16"/></clipPath>
  </defs>

  <style>
    text{font-family:'JetBrains Mono','Fira Code',Consolas,'Liberation Mono','Courier New',monospace}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .gc{animation:gc 4.5s steps(1) infinite}
    .gm{animation:gm 4.5s steps(1) infinite}
    .gmain{animation:gmain 4.5s steps(1) infinite;transform-origin:60px 160px}
    @keyframes gc{0%,86%,100%{opacity:0;transform:translate(0,0)}87%{opacity:.85;transform:translate(-7px,-2px)}89%{opacity:.85;transform:translate(4px,1px)}91%{opacity:.85;transform:translate(-3px,2px)}93%{opacity:0}}
    @keyframes gm{0%,86%,100%{opacity:0;transform:translate(0,0)}87%{opacity:.85;transform:translate(7px,2px)}89%{opacity:.85;transform:translate(-5px,-1px)}91%{opacity:.85;transform:translate(3px,-2px)}93%{opacity:0}}
    @keyframes gmain{0%,86%,94%,100%{transform:none}88%{transform:translateX(3px) skewX(-8deg)}90%{transform:translateX(-3px) skewX(6deg)}92%{transform:translateX(1px)}}
    .sweep{animation:sweep 6s linear infinite}
    @keyframes sweep{from{transform:translateY(-130px)}to{transform:translateY(360px)}}
    .rain{animation-name:rain;animation-timing-function:linear;animation-iteration-count:infinite}
    @keyframes rain{from{transform:translateY(-140px)}to{transform:translateY(380px)}}
    .load{transform-origin:60px 0;animation:load 2.8s cubic-bezier(.2,.8,.2,1) forwards;transform:scaleX(0)}
    @keyframes load{to{transform:scaleX(1)}}
    .spin{transform-origin:870px 165px;animation:spin 14s linear infinite}
    .spinr{transform-origin:870px 165px;animation:spin 9s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.load{transform:none}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="340" fill="url(#bg)"/>
    <rect width="1000" height="340" fill="url(#grid)"/>

    <!-- data streams -->
    <g>
      <rect class="rain" x="752" y="0" width="2" height="90"  fill="url(#drop)" style="animation-duration:3.8s;animation-delay:-1.2s"/>
      <rect class="rain" x="784" y="0" width="2" height="60"  fill="url(#drop)" style="animation-duration:2.9s;animation-delay:-2.1s"/>
      <rect class="rain" x="816" y="0" width="2" height="110" fill="url(#drop)" style="animation-duration:4.6s;animation-delay:-.4s"/>
      <rect class="rain" x="848" y="0" width="2" height="70"  fill="url(#drop)" style="animation-duration:3.3s;animation-delay:-3s"/>
      <rect class="rain" x="880" y="0" width="2" height="95"  fill="url(#drop)" style="animation-duration:4.1s;animation-delay:-1.7s"/>
      <rect class="rain" x="912" y="0" width="2" height="55"  fill="url(#drop)" style="animation-duration:2.6s;animation-delay:-.9s"/>
      <rect class="rain" x="944" y="0" width="2" height="120" fill="url(#drop)" style="animation-duration:5s;animation-delay:-2.6s"/>
      <rect class="rain" x="968" y="0" width="2" height="65"  fill="url(#drop)" style="animation-duration:3.1s;animation-delay:-.2s"/>
    </g>

    <!-- HUD reticle -->
    <circle cx="870" cy="165" r="84" fill="#05050A" fill-opacity=".75" stroke="#00F0FF" stroke-opacity=".2"/>
    <circle class="spin"  cx="870" cy="165" r="72" fill="none" stroke="#00F0FF" stroke-width="2" stroke-dasharray="46 12 6 12" filter="url(#soft)"/>
    <circle class="spinr" cx="870" cy="165" r="58" fill="none" stroke="#FF007F" stroke-width="2" stroke-dasharray="80 26" filter="url(#soft)"/>
    <circle cx="870" cy="165" r="44" fill="none" stroke="#B026FF" stroke-opacity=".45" stroke-dasharray="2 5"/>
    <text x="870" y="176" text-anchor="middle" font-size="30" font-weight="700" fill="url(#neon)" filter="url(#soft)">&lt;/&gt;</text>

    <!-- scan beam -->
    <rect class="sweep" x="0" y="0" width="1000" height="120" fill="url(#beam)"/>

    <!-- top bar -->
    <text x="40" y="46" font-size="14">
      <tspan fill="#00FF66">root@youssefabidi13</tspan><tspan fill="#6B6B8A">:</tspan><tspan fill="#00F0FF">~</tspan><tspan fill="#6B6B8A">$ </tspan><tspan fill="#E6F7FF">./boot --profile --neon</tspan>
    </text>
    <rect class="blink" x="430" y="34" width="9" height="15" fill="#00F0FF"/>
    <circle class="pulse" cx="818" cy="41" r="4" fill="#00FF66"/>
    <text x="830" y="46" font-size="13" fill="#00FF66">link secure</text>

    <!-- identity -->
    <text x="60" y="108" font-size="13" fill="#FF007F" letter-spacing="3">// identity verified</text>
    <g font-size="66" font-weight="800" letter-spacing="2">
      <text class="gc"    x="60" y="178" fill="#00F0FF">YOUSSEF ABIDI</text>
      <text class="gm"    x="60" y="178" fill="#FF007F">YOUSSEF ABIDI</text>
      <text class="gmain" x="60" y="178" fill="url(#neon)" filter="url(#glow)">YOUSSEF ABIDI</text>
    </g>
    <text x="60" y="216" font-size="18" fill="#00F0FF">Shopify platform engineer &amp; full-stack software engineer</text>
    <text x="60" y="244" font-size="14" fill="#8B8BA7">Java / Spring Boot · React / Angular · Shopify Functions &amp; Admin UI extensions</text>

    <!-- loader -->
    <rect x="60" y="272" width="440" height="4" rx="2" fill="#1A1A2E"/>
    <rect class="load" x="60" y="272" width="440" height="4" rx="2" fill="url(#neon)" filter="url(#soft)"/>
    <text x="512" y="278" font-size="12" fill="#00F0FF">modules loaded</text>

    <!-- bottom bar -->
    <circle class="pulse" cx="64" cy="307" r="4" fill="#00FF66"/>
    <text x="76" y="312" font-size="13" fill="#00FF66">online <tspan fill="#6B6B8A">|</tspan> <tspan fill="#E6F7FF">Oracle Certified Java SE 17 + 21</tspan></text>
    <text x="960" y="312" font-size="13" fill="#6B6B8A" text-anchor="end">node: morocco [MA] <tspan fill="#FF007F">|</tspan> session 0x7E3A</text>

    <!-- scanlines -->
    <rect width="1000" height="340" fill="url(#scan)" pointer-events="none"/>
  </g>

  <!-- frame + HUD corners -->
  <rect x="8" y="8" width="984" height="324" rx="16" fill="none" stroke="url(#neon)" stroke-opacity=".55" stroke-width="1.5"/>
  <g fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#soft)">
    <path d="M22 54V22H54"/><path d="M946 22H978V54"/>
  </g>
  <g fill="none" stroke="#FF007F" stroke-width="3" filter="url(#soft)">
    <path d="M22 286V318H54"/><path d="M946 318H978V286"/>
  </g>
</svg>
